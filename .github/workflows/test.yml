name: Hotel tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest test_world test_hotel -v
      - run: node --check app.js && node --check catalogue.js && node --check lobby.js && node --check voxel.js && node --check voxel-scene.js
