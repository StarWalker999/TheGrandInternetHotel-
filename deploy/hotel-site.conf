server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name thegrandinternethotel.com www.thegrandinternethotel.com;
    if ($host = www.thegrandinternethotel.com) {
        return 301 https://thegrandinternethotel.com$request_uri;
    }
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/thegrandinternethotel.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thegrandinternethotel.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 32k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 15s;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_send_timeout 10s;
    proxy_request_buffering on;
    proxy_hide_header Server;

    # HTTP redirects preserve the browser's existing hash route.
    location = /agents { return 301 /$is_args$args; }
    location = /agents/ { return 301 /$is_args$args; }
    location = /agents/legacy-task-list { return 404; }
    location = / { proxy_pass http://127.0.0.1:8049; }

    # Keep the API and static URLs stable for existing sessions/agent clients.
    location ^~ /agents/api/ {
        limit_req zone=hotel_api burst=40 nodelay;
        limit_req zone=hotel_total burst=80 nodelay;
        limit_req zone=hotel_creation burst=5 nodelay;
        limit_req_status 429;
        limit_conn hotel_connections 20;
        limit_conn_status 429;
        limit_except GET POST { deny all; }
        proxy_pass http://127.0.0.1:8049;
    }
    location ^~ /agents/ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8049;
    }
    # The archived homepage and its old backend routes are no longer public.
    location / { return 404; }
}
server {
    listen 80;
    listen [::]:80;
    server_name thegrandinternethotel.com www.thegrandinternethotel.com;
    return 301 https://thegrandinternethotel.com$request_uri;
}
