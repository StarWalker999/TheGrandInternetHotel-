# Install in /etc/nginx/conf.d/ (http context).
# Keys use the socket peer, never a client-supplied forwarding header.
limit_req_zone $binary_remote_addr zone=hotel_api:10m rate=20r/s;
limit_req_zone $server_name zone=hotel_total:1m rate=100r/s;
map $uri $hotel_creation_key {
    default "";
    /agents/api/checkin $binary_remote_addr;
    /agents/api/simulation/start $binary_remote_addr;
}
limit_req_zone $hotel_creation_key zone=hotel_creation:1m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=hotel_connections:10m;
